{% extends 'base.html' %}
{% block title %}500 Internal Error — AML Analytics{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel p-5 text-center">
            <i class="fa-solid fa-bug text-danger display-1 mb-3 opacity-75"></i>
            <h3 class="fw-bold text-white mb-2">500 — System Internal Error</h3>
            <p class="text-secondary small mb-4">An unexpected processing fault occurred in the inference engine. The error details have been logged for forensic review.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-glass-primary">
                <i class="fa-solid fa-house me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
