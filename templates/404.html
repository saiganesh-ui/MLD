{% extends 'base.html' %}
{% block title %}404 Page Not Found — AML Analytics{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel p-5 text-center">
            <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-3 opacity-75"></i>
            <h3 class="fw-bold text-white mb-2">404 — Entity Not Found</h3>
            <p class="text-secondary small mb-4">The requested compliance record, account ledger, or system route does not exist.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-glass-primary">
                <i class="fa-solid fa-house me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
